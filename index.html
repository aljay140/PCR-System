<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Ally's PCRs</title>
    <meta name="description" content="Ally's PCR System">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <section class="header-container">
            <img src="" class="header-logo" width="50px" height="50px">
            <h1>Ally's PCRs</h1>
        </section>
    </header>

    <nav>
        <section class="navbar-container">
            <button class="btn-primary">
                <h3>PCRs</h3>
            </button>
            <button>
                <h3>User</h3>
            </button>
            <button>
                <h3>Settings</h3>
            </button>
            <button>
                <h3>Reports</h3>
            </button>
        </section>
    </nav>

    <main>
        <section class="side-nav-container">
            <button class="btn">run form start</button>
            <button class="btn">dispatch</button>
            <button class="btn">response</button>
            <button class="btn">arrival</button>
            <button class="btn">assessment</button>
            <button class="btn">treatment</button>
            <button class="btn">narrative</button>
            <button class="btn">billing information</button>
            <button class="btn">signatures</button>
        </section>
        <section class="form-container">
            <section class="sub-navbar">
                <button class="">one</button>
                <button>two</button>
                <button>three</button>
                <button>four</button>
                <button>five</button>
                <button>six</button>
            </section>
            <form>
                <label for="first-input">First text box:</label>
                <input type="text" name="first-input" id="first-input">

                <label for="second-input">Second text box:</label>
                <input type="text" name="second" id="second-input" placeholder="this is some text">


                <div class="test-checks">
                    <h4>check box section</h4>
                    <div class="box1">
                        <label for="test-check-one">test one</label>
                        <input type="checkbox" name="test-check-one" id="test-check-one">
                    </div>
                    <div class="box2">
                        <label for="test-check-two">test two</label>
                        <input type="checkbox" name="test-check-two" id="test-check-two">
                    </div>
                    <div class="box3">
                        <label for="test-check-three">test three</label>
                        <input type="checkbox" name="test-check-three" id="test-check-three">
                    </div>
                    <div class="box4">
                        <label for="test-check-four">test four</label>
                        <input type="checkbox" name="test-check-four" id="test-check-four">
                    </div>
                </div>

                <label for="story">Tell us your story:</label>
                <textarea id="story" name="story" rows="30" cols="100"
                    placeholder="You'll never believe this..."></textarea>

            </form>
        </section>
    </main>

    <footer>
        <h5>footer o' the page</h5>
    </footer>

    <script src="script.js" async defer></script>
    <!-- bootstrap js vvv -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
